<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #1e3799);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .card-login {
            width: 420px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(9px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-custom {
            background-color: #f1c40f;
            border: none;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #f39c12;
        }

        input {
            background-color: rgba(255,255,255,0.85) !important;
        }

        a {
            color: #f1c40f;
            font-weight: bold;
        }
    </style>

</head>
<body>

    <div class="card-login">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>

        <form method="POST">
            {% csrf_token %}

            <label class="mb-1">Usuario</label>
            <input type="text" name="username" class="form-control mb-3" placeholder="Ingresa tu usuario" required>

            <label class="mb-1">Contraseña</label>
            <input type="password" name="password" class="form-control mb-3" placeholder="Ingresa tu contraseña" required>

            <button type="submit" class="btn btn-custom w-100 mt-2">Ingresar</button>
        </form>

        {% if mensaje %}
            <p class="text-warning mt-3 text-center">{{ mensaje }}</p>
        {% endif %}

        <p class="mt-3 text-center">
            ¿No tienes cuenta?
            <a href="/registro/">Crear usuario</a>
        </p>
    </div>

</body>
</html>
