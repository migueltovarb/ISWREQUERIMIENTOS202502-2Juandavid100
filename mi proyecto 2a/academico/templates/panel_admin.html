<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #1e3799);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .panel-card {
            background: rgba(255,255,255,0.1);
            padding: 35px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            width: 450px;
            text-align: center;
        }
        .btn-custom {
            background-color: #f1c40f;
            border: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-secondary {
            background-color: rgba(255,255,255,0.3)!important;
            border: none;
            color: white!important;
            margin-top: 12px;
        }
        .btn-danger {
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="panel-card">
    <h2>Panel Administrador</h2>
    <p>Bienvenido {{ request.user.username }}</p>

    <a href="#" class="btn btn-custom w-100">Gestionar Cursos</a>
    <a href="#" class="btn btn-custom w-100">Crear Periodo</a>

    <a href="/panel/admin/" class="btn btn-secondary w-100">Volver</a>
    <a href="/logout/" class="btn btn-danger w-100">Cerrar sesión</a>
</div>

</body>
</html>
