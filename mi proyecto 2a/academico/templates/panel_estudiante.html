<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #1e3799);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card-panel {
            width: 500px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .btn-inscribir {
            background-color: #f1c40f;
            border: none;
            font-weight: bold;
        }

        .btn-inscribir:hover {
            background-color: #d4ac0d;
        }

        .btn-logout {
            background-color: #c0392b;
            border: none;
            font-weight: bold;
        }

        .btn-logout:hover {
            background-color: #922b21;
        }
    </style>
</head>
<body>

    <div class="card-panel">
        <h2>Panel Estudiante</h2>

        <p>Bienvenido {{ request.user.username }}</p>

        <!-- Botón que te lleva a inscribir cursos -->
        <a href="/estudiante/inscribir-cursos/" class="btn btn-inscribir w-100 mt-3">
            Inscribir Cursos
        </a>

        <a href="/logout/" class="btn btn-logout w-100 mt-3">Cerrar sesión</a>
    </div>

</body>
</html>
