<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos Inscritos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #1e3799);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card-custom {
            width: 500px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-volver {
            background-color: #60a3bc;
            border: none;
            font-weight: bold;
        }

        .btn-volver:hover {
            background-color: #3c6382;
        }

        ul li {
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="card-custom">
        <h2 class="text-center">Cursos Inscritos</h2>
        <p class="text-center">Has inscrito los siguientes cursos:</p>

        <ul>
            {% for c in cursos %}
                <li>{{ c }}</li>
            {% endfor %}
        </ul>

        <a href="/panel/estudiante/" class="btn btn-volver w-100 mt-3">Volver al Panel</a>
    </div>

</body>
</html>
