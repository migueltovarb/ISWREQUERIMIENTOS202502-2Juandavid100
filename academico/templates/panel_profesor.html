<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Profesor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #1e3799);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .panel-card {
            background: rgba(255,255,255,0.12);
            padding: 40px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            width: 520px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .btn-main {
            background-color: #f1c40f;
            font-weight: bold;
        }

        .btn-main:hover {
            background-color: #d4ac0d;
        }

        .btn-option {
            background: rgba(255,255,255,0.3);
            color: white;
            margin-top: 12px;
        }

        .btn-option:hover {
            background: rgba(255,255,255,0.5);
        }

        .title-section {
            font-size: 22px;
            margin-top: 25px;
            margin-bottom: 10px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="panel-card">

    <h1>Panel Profesor</h1>
    <p>Bienvenido <strong>{{ request.user.username }}</strong></p>

    <div class="title-section">Materias</div>

    <!-- Adornos -->
    <button class="btn btn-option w-100">Matemáticas I</button>
    <button class="btn btn-option w-100">Física Mecánica</button>
    <button class="btn btn-option w-100">Álgebra Lineal</button>
    <button class="btn btn-option w-100">Programación I</button>

    <!-- Botón REAL que redirige -->
    <a href="/profesor/registrar-notas/" class="btn btn-main w-100 mt-3">
        Registrar Notas
    </a>

    <!-- Volver y salir -->
    <a href="/panel/profesor/" class="btn btn-secondary w-100 mt-3">Volver</a>
    <a href="/logout/" class="btn btn-danger w-100 mt-2">Cerrar sesión</a>

</div>

</body>
</html>
