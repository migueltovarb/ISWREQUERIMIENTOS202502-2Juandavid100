<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #1e3799);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .card-registro {
            width: 450px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(9px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-custom {
            background-color: #3498db;
            border: none;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #2980b9;
        }

        input, select {
            background-color: rgba(255,255,255,0.88) !important;
        }

        a {
            color: #f1c40f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card-registro">
        <h2 class="text-center mb-4">Registro de Usuario</h2>

        {% if mensaje %}
            <p class="text-warning text-center">{{ mensaje }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label class="mb-1">Usuario:</label>
            <input type="text" name="username" class="form-control mb-3" placeholder="Nombre sin espacios" required>

            <label class="mb-1">Contraseña:</label>
            <input type="password" name="password" class="form-control mb-3" placeholder="Contraseña" required>

            <label class="mb-1">Rol:</label>
            <select name="rol" class="form-control mb-3">
                <option value="estudiante">Estudiante</option>
                <option value="profesor">Profesor</option>
                <option value="admin">Administrador</option>
            </select>

            <button class="btn btn-custom w-100 mt-2" type="submit">Registrar</button>
        </form>

        <p class="mt-3 text-center">
            ¿Ya tienes cuenta?
            <a href="/">Iniciar sesión</a>
        </p>
    </div>

</body>
</html>
