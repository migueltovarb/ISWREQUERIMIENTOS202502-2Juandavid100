<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscribir Cursos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a3d62, #1e3799);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card-custom {
            width: 500px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-inscribir {
            background-color: #38ada9;
            border: none;
            font-weight: bold;
        }

        .btn-inscribir:hover {
            background-color: #079992;
        }

        .btn-volver {
            background-color: #60a3bc;
            border: none;
            font-weight: bold;
        }

        .btn-volver:hover {
            background-color: #3c6382;
        }

        ul {
            color: yellow;
        }
    </style>
</head>
<body>

    <div class="card-custom">
        <h2 class="text-center mb-3">Inscribir Cursos</h2>

        {% if error %}
            <p class="text-warning text-center">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <p class="text-center">Selecciona entre <strong>3 y 5</strong> cursos:</p>

            {% for curso in cursos %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="cursos" value="{{ curso }}">
                    <label class="form-check-label">
                        {{ curso }}
                    </label>
                </div>
            {% endfor %}

            <button class="btn btn-inscribir w-100 mt-3" type="submit">Inscribir</button>
        </form>

        <a href="/panel/estudiante/" class="btn btn-volver w-100 mt-3">Volver</a>
    </div>

</body>
</html>
